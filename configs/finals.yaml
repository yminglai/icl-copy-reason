n: 160
dtype: bfloat16                  # float32 for the re-scoring check (variants --fp32)
copy_share: {seeds: [0, 1], tag: "", tasks: [bind_a, bind_b, compose_s, compose_h], bs: 16}
ablation:
  original_spans: {seeds: [0, 1], tag: "", sets: [competitor, single2, sham, otherbundles, wordB]}
  token_matched:  {seeds: [0, 1], tag: "_tokmatched", sets: [competitor_marker, wordA, single2_marker]}
  fresh_items:    {seeds: [2, 3], tag: "_fresh", sets: [competitor, single2, sham, otherbundles, wordB, competitor_marker, wordA, single2_marker]}
  item_seed_offset: 11
  bs: 8
controls: {seeds: [0, 1], presentations: [order_ba, demos_1_1, demos_3_3, singles_only, bundles_only, template_alt]}   # see configs/diagnostic.yaml
rescoring:
  seeds: [2, 3]
  rules: [sum, len, div]
  bfloat16_tag: _rescored
  float32_tag: _rescored_fp32
  float32_models: [EleutherAI/pythia-1.4b, EleutherAI/pythia-2.8b, EleutherAI/pythia-12b, allenai/OLMo-2-0425-1B, allenai/OLMo-2-1124-7B, allenai/OLMo-2-1124-13B,
                   Qwen/Qwen3-0.6B-Base, Qwen/Qwen3-1.7B-Base, Qwen/Qwen3-8B-Base, Qwen/Qwen2.5-7B, unsloth/gemma-3-4b-pt]
  single_token_subset: {finals_tag: _fresh, traj_model: OLMo-2-1124-7B}
qwen05_check: {model: Qwen/Qwen2.5-0.5B, seeds: [2, 3], dtypes: [float32, bfloat16], patch_layer: 4, patch_seeds: [0, 1]}
batching_check: {model: EleutherAI/pythia-1.4b, revision: step143000, n: 50, seed: 2, dtypes: [float32, bfloat16]}
bootstrap: {resamples: 2000, seed: 0}
