# Copy-probability share + attention ablation of released models (the fingerprint block), with the fresh-item re-scoring.
# Every model is loaded at the Hub `main` branch (Pythia at step143000 = the final checkpoint); the commit of `main` at measurement
# time is pinned below so a later Hub change is detectable (readings record a weight fingerprint too).
