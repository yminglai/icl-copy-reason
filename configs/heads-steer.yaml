  models: [EleutherAI/pythia-1.4b, EleutherAI/pythia-12b]
  seeds: [2, 3]
  pool: second_markers
  tag: _shamfix
steering:              # heads.steer: scale top-k pro-copied heads (alpha) / pro-correct heads (beta) from the query line on
  models: [EleutherAI/pythia-1.4b, EleutherAI/pythia-2.8b, EleutherAI/pythia-12b, allenai/OLMo-2-0425-1B, allenai/OLMo-2-1124-7B, allenai/OLMo-2-1124-13B,
           Qwen/Qwen2.5-1.5B, Qwen/Qwen2.5-7B, Qwen/Qwen3-0.6B-Base, Qwen/Qwen3-1.7B-Base, Qwen/Qwen3-4B-Base, Qwen/Qwen3-8B-Base, unsloth/gemma-3-4b-pt]
  pythia_revision: step143000
  seeds: [2, 3]
  k: [10, 5]
  suppress_alpha: [0.0, 0.5]
  amplify_beta: [1.5, 2.0]
  both: [[0.5, 1.5], [0.0, 2.0]]
  n_random: 19                 # 0 for the models already at ceiling (no beyond-random rule)
  random_seed_offset: 1000
  primary: {sup_a0.0: [R, 0.0, null], amp_b2.0: [B, null, 2.0], both_a0.5_b1.5: [RB, 0.5, 1.5]}
